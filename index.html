<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChatGPT iOS Voice Feature Prototype</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- SF Pro / Inter font fallback -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* Custom scrollbars */
        ::-webkit-scrollbar {
            display: none;
        }

        /* Task pill track height transition */
        .pill-track-container {
            transition: opacity 150ms ease-in-out, max-height 150ms ease-in-out, margin 150ms ease-in-out;
            max-height: 50px;
            opacity: 1;
            overflow: hidden;
        }

        .pill-track-collapsed {
            max-height: 0px !important;
            opacity: 0 !important;
            margin-top: 0px !important;
            margin-bottom: 0px !important;
            pointer-events: none;
        }

        /* Keyboard and composer drawers */
        .keyboard-drawer {
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .composer-area {
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Custom key styling to mimic iOS dark keyboard */
        .ios-key {
            background-color: #3a3a3c;
            color: #ffffff;
            border-radius: 7px;
            font-size: 20px;
            font-weight: 400;
            box-shadow: 0 1px 0 rgba(0,0,0,0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.1s ease;
        }

        .ios-key:active {
            background-color: #636366 !important;
        }

        .ios-key-modifier {
            background-color: #2c2c2e;
        }

        .ios-key-modifier:active {
            background-color: #48484a !important;
        }
    </style>
</head>
<body class="bg-[#121212] text-white h-[100dvh] max-h-[100dvh] w-full flex flex-col items-center justify-center p-1 sm:p-3 overflow-hidden select-none">

    <!-- OpenAI Style Prototype Header Deck -->
    <header class="w-full max-w-[375px] shrink-0 bg-[#0f0f11]/95 backdrop-blur-md text-zinc-300 text-xs px-2.5 py-1.5 flex items-center justify-between border border-zinc-800/80 rounded-t-2xl z-30 shadow-2xl">
        <!-- Left: Brand Tag & Pulse Status -->
        <div class="flex items-center gap-1.5">
            <div class="w-4 h-4 rounded bg-zinc-800 border border-zinc-700/60 flex items-center justify-center text-white text-[9px] shadow-inner">
                <i class="fa-solid fa-sparkles text-[8px] text-zinc-300"></i>
            </div>
            <div class="flex items-center gap-1">
                <span class="font-semibold text-white tracking-tight text-[11.5px]">ChatGPT</span>
                <span class="px-1 py-0.2 rounded text-[8px] font-mono tracking-wider font-semibold bg-zinc-800/90 text-zinc-400 border border-zinc-700/50 uppercase">Voice</span>
            </div>
        </div>

        <!-- Right: Segmented Design System Controls -->
        <div class="flex items-center bg-zinc-950/80 p-0.5 rounded-full border border-zinc-800/80 shadow-inner">
            <button onclick="forceShowWeeklySummary()" title="Trigger Weekly Summary Card" class="px-2 py-0.5 rounded-full hover:bg-zinc-800/80 active:scale-95 text-zinc-300 hover:text-white text-[10px] font-medium transition-all flex items-center gap-1">
                <i class="fa-solid fa-sparkles text-[9px] text-zinc-400"></i>
                <span>Summary</span>
            </button>
            
            <div class="w-[1px] h-2.5 bg-zinc-800"></div>

            <button onclick="toggleKeyboard()" title="Toggle Virtual Keyboard" class="px-2 py-0.5 rounded-full hover:bg-zinc-800/80 active:scale-95 text-zinc-300 hover:text-white text-[10px] font-medium transition-all flex items-center gap-1">
                <i class="fa-regular fa-keyboard text-[10px] text-zinc-400"></i>
                <span id="kbToggleLabel">Show KB</span>
            </button>

            <button onclick="startNewChat()" title="Start New Session" class="ml-0.5 px-2 py-0.5 bg-white hover:bg-zinc-200 active:scale-95 text-black rounded-full text-[10px] font-semibold transition-all shadow-sm flex items-center gap-0.5">
                <i class="fa-solid fa-plus text-[8px]"></i>
                <span>New</span>
            </button>
        </div>
    </header>

    <!-- Main Mobile Device Screen Container -->
    <div class="w-full max-w-[375px] flex-1 h-full max-h-[calc(100dvh-3rem)] sm:max-h-[620px] bg-black rounded-b-2xl sm:rounded-b-3xl shadow-2xl flex flex-col relative overflow-hidden border-x border-b border-zinc-900">

        <div class="w-full h-8 px-4 pt-1 flex items-center justify-between text-white text-xs font-semibold select-none bg-black z-30 relative shrink-0">
            <!-- Left: Time + Silent Bell Icon -->
            <div class="flex items-center gap-1.5">
                <span class="text-[11px] font-semibold tracking-tight text-white">11:44</span>
                <i class="fa-solid fa-bell-slash text-[9px] text-white"></i>
            </div>
            <div class="flex items-center gap-1">
                <span class="font-semibold text-white tracking-tight text-[11.5px]">ChatGPT</span>
                <span class="px-1 py-0.2 rounded text-[8px] font-mono tracking-wider font-semibold bg-zinc-800/90 text-zinc-400 border border-zinc-700/50 uppercase">Voice</span>
            </div>
        </div>

        <!-- Right: Segmented Design System Controls -->
        <div class="flex items-center bg-zinc-950/80 p-0.5 rounded-full border border-zinc-800/80 shadow-inner">
            <button onclick="forceShowWeeklySummary()" title="Trigger Weekly Summary Card" class="px-2 py-0.5 rounded-full hover:bg-zinc-800/80 active:scale-95 text-zinc-300 hover:text-white text-[10px] font-medium transition-all flex items-center gap-1">
                <i class="fa-solid fa-sparkles text-[9px] text-zinc-400"></i>
                <span>Summary</span>
            </button>
            
            <div class="w-[1px] h-2.5 bg-zinc-800"></div>

            <button onclick="toggleKeyboard()" title="Toggle Virtual Keyboard" class="px-2 py-0.5 rounded-full hover:bg-zinc-800/80 active:scale-95 text-zinc-300 hover:text-white text-[10px] font-medium transition-all flex items-center gap-1">
                <i class="fa-regular fa-keyboard text-[10px] text-zinc-400"></i>
                <span id="kbToggleLabel">Show KB</span>
            </button>

            <button onclick="startNewChat()" title="Start New Session" class="ml-0.5 px-2 py-0.5 bg-white hover:bg-zinc-200 active:scale-95 text-black rounded-full text-[10px] font-semibold transition-all shadow-sm flex items-center gap-0.5">
                <i class="fa-solid fa-plus text-[8px]"></i>
                <span>New</span>
            </button>
        </div>
    </header>

    <!-- Main Mobile Device Screen Container -->
    <div class="w-full max-w-[375px] h-[680px] max-h-[82vh] bg-black sm:rounded-b-3xl shadow-2xl flex flex-col relative overflow-hidden border-x border-b border-zinc-900">

        <div class="w-full h-9 px-5 pt-1.5 flex items-center justify-between text-white text-xs font-semibold select-none bg-black z-30 relative shrink-0">
            <!-- Left: Time + Silent Bell Icon -->
            <div class="flex items-center gap-1.5">
                <span class="text-xs font-semibold tracking-tight text-white">5:48</span>
                <i class="fa-solid fa-bell-slash text-[10px] text-white"></i>
            </div>

            <!-- Center: Orange Mic Privacy Dot -->
            <div id="iosMicOrangeDot" class="w-1.5 h-1.5 rounded-full bg-orange-500 opacity-0 transition-opacity duration-200"></div>

            <!-- Right: Cellular, Wi-Fi & Battery Capsule -->
            <div class="flex items-center gap-1.5 text-xs">
                <span class="text-[10px] font-bold text-white tracking-wider">5G</span>
                <div class="flex items-end gap-[1.5px] h-[9px]">
                    <span class="w-[2.5px] h-[3px] bg-white rounded-[0.5px]"></span>
                    <span class="w-[2.5px] h-[5px] bg-white rounded-[0.5px]"></span>
                    <span class="w-[2.5px] h-[7px] bg-white rounded-[0.5px]"></span>
                    <span class="w-[2.5px] h-[9px] bg-white rounded-[0.5px]"></span>
                </div>
                <i class="fa-solid fa-wifi text-[10px] text-white"></i>
                <div class="relative w-[22px] h-[11px] bg-white rounded-[3.5px] flex items-center justify-center shadow-sm">
                    <div class="absolute -right-[2.5px] top-[3px] w-[1.5px] h-[4px] bg-white rounded-r-[1px]"></div>
                    <span class="text-[8.5px] font-black tracking-tighter leading-none text-black select-none">76</span>
                </div>
            </div>
        </div>

        <header class="w-full h-11 px-3.5 flex items-center justify-between bg-black z-20 shrink-0">
            <!-- Left: Sidebar Toggle Button -->
            <button onclick="toggleSidebar(true)" class="w-8 h-8 rounded-full bg-[#1c1c1e] hover:bg-[#2c2c2e] active:scale-95 flex items-center justify-center transition-all">
                <div class="flex flex-col gap-[3px] w-3.5 items-center">
                    <div class="w-full h-[1.5px] bg-white rounded-full"></div>
                    <div class="w-full h-[1.5px] bg-white rounded-full"></div>
                </div>
            </button>

            <!-- Center: Upgrade Pill Button -->
            <button class="px-3 py-1 rounded-full bg-[#1c1c1e] hover:bg-[#2c2c2e] active:scale-95 border border-zinc-800 text-[11px] font-semibold text-blue-400 flex items-center gap-1 transition-all shadow-sm">
                <i class="fa-solid fa-diamond text-[9px] text-blue-400"></i>
                <span>Upgrade</span>
            </button>

            <!-- Right: New Chat Icon Button -->
            <button onclick="startNewChat()" class="w-8 h-8 rounded-full bg-[#1c1c1e] hover:bg-[#2c2c2e] active:scale-95 flex items-center justify-center transition-all">
                <i class="fa-regular fa-comment-dots text-white text-sm"></i>
            </button>
        </header>

        <main id="chatMainCanvas" onclick="dismissKeyboardAndFocus()" class="flex-1 bg-black px-3.5 py-2 flex flex-col justify-end relative overflow-y-auto">
            
            <!-- Messages Container -->
            <div id="messagesContainer" class="w-full space-y-3 my-auto flex flex-col justify-center min-h-[220px]">
                
                <!-- Initial Empty Chat Canvas Graphic -->
                <div id="emptyChatState" class="flex flex-col items-center justify-center text-center py-8 space-y-3">
                    <div class="w-10 h-10 rounded-full bg-[#1c1c1e] border border-zinc-800 flex items-center justify-center text-white text-lg shadow-lg">
                        <i class="fa-solid fa-sparkles"></i>
                    </div>
                    <p class="text-zinc-400 text-xs font-medium">What can I help with today?</p>
                </div>

                <!-- Chat history dynamically appended here -->
            </div>
        </main>

        <div id="composerAreaWrapper" class="composer-area w-full px-3 pt-1 pb-2 bg-black z-20 shrink-0 relative">

            <!-- Integrated Task-Pill Row -->
            <div id="taskPillTrack" class="pill-track-container w-full mb-1.5">
                <div class="flex items-center gap-1.5 overflow-x-auto pb-1 px-0.5 scrollbar-none">
                    <button onclick="activateTaskPill('Quick Lookup')" class="px-3.5 py-1.5 rounded-full bg-[#212121] hover:bg-[#2f2f2f] active:bg-[#2f2f2f] border border-[#303030] hover:border-[#424242] text-[#ececec] text-[12px] font-normal whitespace-nowrap transition-all shrink-0">
                        <span>Quick Lookup</span>
                    </button>
                    <button onclick="activateTaskPill('Brainstorm')" class="px-3.5 py-1.5 rounded-full bg-[#212121] hover:bg-[#2f2f2f] active:bg-[#2f2f2f] border border-[#303030] hover:border-[#424242] text-[#ececec] text-[12px] font-normal whitespace-nowrap transition-all shrink-0">
                        <span>Brainstorm</span>
                    </button>
                    <button onclick="activateTaskPill('Summarize')" class="px-3.5 py-1.5 rounded-full bg-[#212121] hover:bg-[#2f2f2f] active:bg-[#2f2f2f] border border-[#303030] hover:border-[#424242] text-[#ececec] text-[12px] font-normal whitespace-nowrap transition-all shrink-0">
                        <span>Summarize</span>
                    </button>
                    <button onclick="activateTaskPill('Draft Email')" class="px-3.5 py-1.5 rounded-full bg-[#212121] hover:bg-[#2f2f2f] active:bg-[#2f2f2f] border border-[#303030] hover:border-[#424242] text-[#ececec] text-[12px] font-normal whitespace-nowrap transition-all shrink-0">
                        <span>Draft Email</span>
                    </button>
                    <button onclick="dismissTaskPillsForever()" title="Dismiss for session" class="w-7 h-7 rounded-full bg-[#212121] hover:bg-[#2f2f2f] border border-[#303030] text-[#737373] hover:text-[#ececec] flex items-center justify-center shrink-0 transition-colors">
                        <i class="fa-solid fa-xmark text-[11px]"></i>
                    </button>
                </div>
            </div>

            <!-- Main Composer Bar -->
            <div id="composerBox" class="w-full bg-[#1c1c1e] border border-zinc-800/80 rounded-full px-2.5 py-1 flex items-center justify-between shadow-xl transition-all">
                
                <!-- State 1: Idle / Typing Composer View -->
                <div id="idleComposerView" class="w-full flex items-center gap-1.5">
                    <!-- Attachment Plus Button -->
                    <button class="w-7 h-7 rounded-full bg-transparent hover:bg-zinc-800 active:scale-95 text-zinc-200 flex items-center justify-center shrink-0 transition-all">
                        <i class="fa-solid fa-plus text-base"></i>
                    </button>

                    <!-- Text Input Box -->
                    <div class="flex-1 flex items-center relative">
                        <input id="chatInput" type="text" placeholder="Ask ChatGPT" 
                               onfocus="onComposerFocus()" 
                               oninput="handleTextInputChange()" 
                               onkeydown="if(event.key === 'Enter') handleSendMessage()"
                               class="w-full bg-transparent text-[14px] text-white placeholder-zinc-500 focus:outline-none px-1 py-0.5">
                    </div>

                    <!-- Right Actions Group -->
                    <div class="flex items-center gap-1.5 shrink-0">
                        <!-- Dictation Mic Button -->
                        <button onclick="startVoiceDictation()" title="Dictate" class="w-7 h-7 rounded-full hover:bg-zinc-800 active:scale-95 text-zinc-300 flex items-center justify-center transition-all">
                            <i class="fa-solid fa-microphone text-base"></i>
                        </button>

                        <!-- Dynamic Action Button: Blue Waveform icon when empty vs Send Arrow when typing -->
                        <button id="dynamicActionButton" onclick="handleDynamicAction()" class="w-7 h-7 rounded-full bg-[#007AFF] hover:bg-blue-500 active:scale-95 text-white flex items-center justify-center transition-all shadow-md shrink-0">
                            <span id="dynamicActionIconContainer" class="flex items-center justify-center">
                                <svg id="waveformSvgIcon" class="w-3.5 h-3.5 text-white fill-current" viewBox="0 0 24 24">
                                    <rect x="2.5" y="8" width="2.2" height="8" rx="1.1" />
                                    <rect x="7" y="4" width="2.2" height="16" rx="1.1" />
                                    <rect x="11.5" y="2" width="2.2" height="20" rx="1.1" />
                                    <rect x="16" y="6" width="2.2" height="12" rx="1.1" />
                                    <rect x="20.5" y="9" width="2.2" height="6" rx="1.1" />
                                </svg>
                                <i id="sendArrowIcon" class="fa-solid fa-arrow-up text-xs text-white hidden"></i>
                            </span>
                        </button>
                    </div>
                </div>

                <!-- State 2: Active Voice Recording View -->
                <div id="recordingComposerView" class="hidden w-full flex items-center justify-between gap-1.5 py-0.5 px-0.5">
                    <!-- Cancel Dictation Button -->
                    <button onclick="cancelVoiceDictation()" title="Cancel" class="w-7 h-7 rounded-full bg-[#2c2c2e] hover:bg-zinc-700 active:scale-95 text-zinc-300 flex items-center justify-center transition-all shrink-0">
                        <i class="fa-solid fa-xmark text-xs"></i>
                    </button>

                    <!-- Waveform Canvas & Active Mode Tag -->
                    <div class="flex-1 flex items-center justify-center gap-1.5 overflow-hidden px-1">
                        <div id="activeModePill" class="hidden flex items-center gap-1 px-2 py-0.5 bg-zinc-800/90 border border-blue-500/30 text-[11px] text-blue-400 rounded-full font-medium shrink-0">
                            <span id="activeModeName"></span>
                            <button onclick="clearActiveModePill(event)" class="text-zinc-400 hover:text-white transition-colors">
                                <i class="fa-solid fa-xmark text-[9px]"></i>
                            </button>
                        </div>
                        <canvas id="waveformCanvas" width="130" height="20" class="h-5 max-w-[130px]"></canvas>
                    </div>

                    <!-- Right Controls: Stop & Send -->
                    <div class="flex items-center gap-1.5 shrink-0">
                        <button onclick="stopVoiceDictation()" title="Stop" class="w-7 h-7 rounded-full bg-[#2c2c2e] hover:bg-zinc-700 active:scale-95 text-zinc-300 flex items-center justify-center transition-all">
                            <i class="fa-solid fa-stop text-[10px]"></i>
                        </button>
                        <button onclick="stopAndSendVoice()" title="Done & Send" class="w-7 h-7 rounded-full bg-[#007AFF] hover:bg-blue-500 active:scale-95 text-white flex items-center justify-center transition-all shadow-md">
                            <i class="fa-solid fa-arrow-up text-xs"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Simulated iOS Keyboard Drawer -->
        <div id="simulatedKeyboard" class="keyboard-drawer absolute bottom-0 left-0 right-0 h-[220px] bg-[#1c1c1e] border-t border-zinc-800/80 transform translate-y-full z-30 pb-2 select-none">
            <!-- Virtual iOS Keyboard Keys Layout -->
            <div class="p-1 space-y-1.5 max-w-sm mx-auto pt-2">
                <!-- Row 1: q w e r t y u i o p -->
                <div class="flex justify-center gap-[4px]">
                    <button onclick="simulateKey('q')" class="ios-key flex-1 h-9">q</button>
                    <button onclick="simulateKey('w')" class="ios-key flex-1 h-9">w</button>
                    <button onclick="simulateKey('e')" class="ios-key flex-1 h-9">e</button>
                    <button onclick="simulateKey('r')" class="ios-key flex-1 h-9">r</button>
                    <button onclick="simulateKey('t')" class="ios-key flex-1 h-9">t</button>
                    <button onclick="simulateKey('y')" class="ios-key flex-1 h-9">y</button>
                    <button onclick="simulateKey('u')" class="ios-key flex-1 h-9">u</button>
                    <button onclick="simulateKey('i')" class="ios-key flex-1 h-9">i</button>
                    <button onclick="simulateKey('o')" class="ios-key flex-1 h-9">o</button>
                    <button onclick="simulateKey('p')" class="ios-key flex-1 h-9">p</button>
                </div>

                <!-- Row 2: a s d f g h j k l -->
                <div class="flex justify-center gap-[4px] px-2.5">
                    <button onclick="simulateKey('a')" class="ios-key flex-1 h-9">a</button>
                    <button onclick="simulateKey('s')" class="ios-key flex-1 h-9">s</button>
                    <button onclick="simulateKey('d')" class="ios-key flex-1 h-9">d</button>
                    <button onclick="simulateKey('f')" class="ios-key flex-1 h-9">f</button>
                    <button onclick="simulateKey('g')" class="ios-key flex-1 h-9">g</button>
                    <button onclick="simulateKey('h')" class="ios-key flex-1 h-9">h</button>
                    <button onclick="simulateKey('j')" class="ios-key flex-1 h-9">j</button>
                    <button onclick="simulateKey('k')" class="ios-key flex-1 h-9">k</button>
                    <button onclick="simulateKey('l')" class="ios-key flex-1 h-9">l</button>
                </div>

                <!-- Row 3: Shift, z x c v b n m, Delete -->
                <div class="flex justify-center gap-[4px]">
                    <button class="ios-key ios-key-modifier w-9 h-9"><i class="fa-solid fa-arrow-up text-xs"></i></button>
                    <button onclick="simulateKey('z')" class="ios-key flex-1 h-9">z</button>
                    <button onclick="simulateKey('x')" class="ios-key flex-1 h-9">x</button>
                    <button onclick="simulateKey('c')" class="ios-key flex-1 h-9">c</button>
                    <button onclick="simulateKey('v')" class="ios-key flex-1 h-9">v</button>
                    <button onclick="simulateKey('b')" class="ios-key flex-1 h-9">b</button>
                    <button onclick="simulateKey('n')" class="ios-key flex-1 h-9">n</button>
                    <button onclick="simulateKey('m')" class="ios-key flex-1 h-9">m</button>
                    <button onclick="simulateBackspace()" class="ios-key ios-key-modifier w-9 h-9"><i class="fa-solid fa-delete-left text-xs"></i></button>
                </div>

                <!-- Row 4: 123, Spacebar, Return key -->
                <div class="flex justify-center gap-[5px] pt-0.5">
                    <button class="ios-key ios-key-modifier w-16 h-9 text-xs font-medium">123</button>
                    <button onclick="simulateKey(' ')" class="ios-key flex-1 h-9 text-xs">space</button>
                    <button onclick="handleSendMessage()" class="ios-key ios-key-modifier w-16 h-9 text-xs"><i class="fa-solid fa-arrow-turn-down transform rotate-90 text-xs"></i></button>
                </div>
            </div>
        </div>

        <!-- Sidebar Overlay & Sliding Sidebar Drawer -->
        <div id="sidebarOverlay" class="absolute inset-0 bg-black/70 z-40 hidden transition-opacity opacity-0" onclick="toggleSidebar(false)"></div>
        
        <aside id="sidebarMenu" class="absolute top-0 left-0 bottom-0 w-[300px] bg-black z-50 transform -translate-x-full transition-transform duration-300 ease-in-out border-r border-zinc-900 px-4 py-6 flex flex-col justify-between overflow-y-auto">
            <div class="space-y-6 pt-4">
                <!-- Sidebar Top Header -->
                <div class="flex items-center justify-between px-1">
                    <h2 class="text-white text-xl font-bold tracking-tight">ChatGPT</h2>
                    <button class="w-9 h-9 rounded-full bg-zinc-900 hover:bg-zinc-800 text-zinc-300 flex items-center justify-center transition-colors">
                        <i class="fa-solid fa-magnifying-glass text-sm"></i>
                    </button>
                </div>

                <!-- Navigation List Items -->
                <nav class="space-y-1">
                    <a href="#" onclick="toggleSidebar(false)" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-zinc-900 text-zinc-200 transition-colors text-sm font-medium">
                        <i class="fa-regular fa-image text-zinc-400 w-5 text-center"></i>
                        <span>Images</span>
                    </a>
                    <a href="#" onclick="toggleSidebar(false)" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-zinc-900 text-zinc-200 transition-colors text-sm font-medium">
                        <i class="fa-solid fa-book-bookmark text-zinc-400 w-5 text-center"></i>
                        <span>Library</span>
                    </a>
                    <a href="#" onclick="toggleSidebar(false)" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-zinc-900 text-zinc-200 transition-colors text-sm font-medium">
                        <i class="fa-regular fa-folder text-zinc-400 w-5 text-center"></i>
                        <span>Projects</span>
                    </a>
                    <a href="#" onclick="toggleSidebar(false)" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-zinc-900 text-zinc-200 transition-colors text-sm font-medium">
                        <i class="fa-regular fa-clock text-zinc-400 w-5 text-center"></i>
                        <span>Scheduled</span>
                    </a>
                    <a href="#" onclick="toggleSidebar(false)" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-zinc-900 text-zinc-200 transition-colors text-sm font-medium">
                        <i class="fa-solid fa-border-all text-zinc-400 w-5 text-center"></i>
                        <span>Explore</span>
                    </a>
                </nav>

                <!-- Recents Header -->
                <div class="pt-2">
                    <h3 class="text-xs font-semibold text-zinc-400 uppercase tracking-wider px-3">Recents</h3>
                    <div class="py-2 px-3 text-xs text-zinc-600">
                        <!-- Intentionally empty -->
                    </div>
                </div>
            </div>

            <!-- Bottom Floating Actions Bar -->
            <div class="pt-4 border-t border-zinc-900 flex items-center justify-between px-2">
                <button onclick="startNewChat(); toggleSidebar(false);" class="px-5 py-2.5 rounded-full bg-blue-600 hover:bg-blue-500 active:scale-95 text-white font-semibold text-sm flex items-center gap-2 shadow-lg transition-all">
                    <i class="fa-regular fa-pen-to-square text-sm"></i>
                    <span>Chat</span>
                </button>

                <button onclick="openSettingsModal()" class="w-10 h-10 rounded-full bg-[#1c1c1e] hover:bg-zinc-800 text-zinc-300 flex items-center justify-center transition-colors" title="Settings">
                    <i class="fa-solid fa-gear text-base"></i>
                </button>
            </div>
        </aside>

        <!-- Secondary Stats Route: Settings -> Voice & Audio Modal -->
        <div id="settingsModal" class="absolute inset-0 bg-black/80 z-50 hidden flex flex-col justify-end sm:justify-center p-4 backdrop-blur-sm transition-opacity">
            <div class="bg-[#1c1c1e] border border-zinc-800 rounded-3xl p-5 space-y-4 max-w-sm mx-auto w-full shadow-2xl text-white">
                <div class="flex items-center justify-between border-b border-zinc-800 pb-3">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-gear text-blue-400"></i>
                        <h3 class="font-bold text-base">Settings</h3>
                    </div>
                    <button onclick="closeSettingsModal()" class="w-8 h-8 rounded-full bg-zinc-800 text-zinc-400 hover:text-white flex items-center justify-center transition-colors">
                        <i class="fa-solid fa-xmark text-sm"></i>
                    </button>
                </div>
                <div>
                    <h4 class="text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">Voice & Audio</h4>
                    <div class="bg-[#2c2c2e] rounded-2xl p-4 space-y-3 border border-zinc-800">
                        <div class="flex justify-between items-center text-xs">
                            <span class="text-zinc-400">Prompts Dictated</span>
                            <span id="settingsPromptCount" class="font-bold text-white">0</span>
                        </div>
                        <div class="flex justify-between items-center text-xs">
                            <span class="text-zinc-400">Words Transcribed</span>
                            <span id="settingsWordCount" class="font-bold text-white">0</span>
                        </div>
                        <div class="flex justify-between items-center text-xs">
                            <span class="text-zinc-400">Time Saved (38 WPM)</span>
                            <span id="settingsTimeSaved" class="font-bold text-emerald-400">0s</span>
                        </div>
                        <div class="pt-2 border-t border-zinc-700/50 flex justify-between items-center">
                            <button onclick="resetVoiceStats()" class="text-xs text-red-400 hover:text-red-300 transition-colors font-medium">Reset Stats</button>
                            <button onclick="simulateVoicePrompts(3)" class="text-xs text-blue-400 hover:underline transition-colors font-medium">+3 Test Prompts</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // ... existing variables ...
        let keyboardVisible = false;

        function toggleKeyboard(show) {
            const kb = document.getElementById('simulatedKeyboard');
            const composerWrapper = document.getElementById('composerAreaWrapper');
            const label = document.getElementById('kbToggleLabel');

            if (show === undefined) {
                keyboardVisible = !keyboardVisible;
            } else {
                keyboardVisible = show;
            }

            if (keyboardVisible) {
                kb.classList.remove('translate-y-full');
                if (composerWrapper) composerWrapper.style.transform = 'translateY(-220px)';
                if (label) label.innerText = 'Hide KB';
            } else {
                kb.classList.add('translate-y-full');
                if (composerWrapper) composerWrapper.style.transform = 'translateY(0px)';
                if (label) label.innerText = 'Show KB';
            }
        }
        // ... existing script code ...
    </script>
</body>
</html>
